name: Install ZZERKOFF AI SEO Checkout Tracker

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create safety backup branch
        shell: bash
        run: |
          set -e
          BACKUP="backup-before-ai-seo-checkout-${GITHUB_RUN_ID}"
          git branch "$BACKUP"
          git push origin "$BACKUP"
          echo "Safety backup: $BACKUP"

      - name: Install AI SEO, validation, location safety and tracking UX
        shell: bash
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"Patch anchor not found: {label}")
              return text.replace(old, new, 1)

          # -------------------------------------------------------------------
          # 1) Server-side Gemini product generator
          # -------------------------------------------------------------------
          path = Path("src/lib/admin.functions.ts")
          text = path.read_text()

          if "export const generateProductContent" not in text:
              text += r'''

          const productAiInput = z.object({
            name: z.string().trim().min(2).max(160),
            category: z.string().trim().min(1).max(80),
            material: z.string().trim().max(200).optional().default(""),
            finish: z.string().trim().max(200).optional().default(""),
            fit_gender: z.string().trim().max(80).optional().default("UNISEX"),
            sizes: z.string().trim().max(200).optional().default(""),
            size_description: z.string().trim().max(500).optional().default(""),
            existing_description: z.string().trim().max(2500).optional().default(""),
          });

          export const generateProductContent = createServerFn({ method: "POST" })
            .middleware([requireSupabaseAuth])
            .inputValidator((input) => productAiInput.parse(input))
            .handler(async ({ data, context }) => {
              await assertAdmin(context);

              const apiKey = process.env.GEMINI_API_KEY;
              if (!apiKey) {
                throw new Error(
                  "GEMINI_API_KEY is not configured on the server. Add it in Vercel Environment Variables.",
                );
              }

              const facts = [
                `Product name: ${data.name}`,
                `Category: ${data.category}`,
                data.material ? `Material: ${data.material}` : "",
                data.finish ? `Finish / color: ${data.finish}` : "",
                data.fit_gender ? `Fit / gender: ${data.fit_gender}` : "",
                data.sizes ? `Sizes: ${data.sizes}` : "",
                data.size_description ? `Size notes: ${data.size_description}` : "",
                data.existing_description
                  ? `Existing notes to improve: ${data.existing_description}`
                  : "",
              ]
                .filter(Boolean)
                .join("\n");

              const prompt = `
          You are the ecommerce copy and SEO assistant for ZZERKOFF, an alternative accessories label.

          Write polished ecommerce copy from ONLY the facts supplied below.
          Never invent metal type, plating, waterproof claims, measurements, origin, weight,
          hypoallergenic claims, warranty, or any other factual attribute that was not supplied.
          Tone: premium, underground, chrome/vintage/gothic/Y2K, concise, clear, not cheesy.
          Write in English.

          PRODUCT FACTS
          ${facts}

          Return:
          - slug: short SEO-friendly lowercase hyphen slug
          - short_description: concise product summary, max 155 characters
          - full_description: 70-120 words, useful and natural
          - tags: 6-12 relevant search tags, no hashtags
          - details_content: concise feature/details copy using only known facts
          - material_content: material/finish copy; if material is unknown, do not guess it
          - care: safe generic accessory care without making material-specific claims
          - seo_title: max 60 characters, include product intent naturally, end with ZZERKOFF only if it fits
          - seo_description: about 145-160 characters, useful and search-friendly
          - image_alt_text: descriptive accessible product image alt text, max 125 characters
          `;

              const response = await fetch(
                "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent",
                {
                  method: "POST",
                  headers: {
          "Content-Type": "application/json",
          "x-goog-api-key": apiKey,
                  },
                  body: JSON.stringify({
          contents: [
            {
              role: "user",
              parts: [{ text: prompt }],
            },
          ],
          generationConfig: {
            temperature: 0.45,
            responseMimeType: "application/json",
            responseSchema: {
              type: "object",
              properties: {
                slug: { type: "string" },
                short_description: { type: "string" },
                full_description: { type: "string" },
                tags: {
                  type: "array",
                  items: { type: "string" },
                },
                details_content: { type: "string" },
                material_content: { type: "string" },
                care: { type: "string" },
                seo_title: { type: "string" },
                seo_description: { type: "string" },
                image_alt_text: { type: "string" },
              },
              required: [
                "slug",
                "short_description",
                "full_description",
                "tags",
                "details_content",
                "material_content",
                "care",
                "seo_title",
                "seo_description",
                "image_alt_text",
              ],
            },
          },
                  }),
                },
              );

              if (!response.ok) {
                const detail = await response.text();
                console.error("[generateProductContent] Gemini error", {
                  status: response.status,
                  detail: detail.slice(0, 800),
                });
                throw new Error(
                  response.status === 429
          ? "Gemini free quota is temporarily exhausted. Try again later."
          : "Gemini could not generate the product content.",
                );
              }

              const body = (await response.json()) as any;
              const raw =
                body?.candidates?.[0]?.content?.parts
                  ?.map((part: any) => part?.text ?? "")
                  .join("")
                  .trim() ?? "";

              if (!raw) {
                throw new Error("Gemini returned an empty response.");
              }

              let parsed: any;
              try {
                parsed = JSON.parse(raw);
              } catch {
                throw new Error("Gemini returned invalid structured content.");
              }

              const clean = (value: unknown, max = 5000) =>
                String(value ?? "")
                  .replace(/\s+/g, " ")
                  .trim()
                  .slice(0, max);

              const slug = clean(parsed.slug, 180)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "");

              const tags = Array.isArray(parsed.tags)
                ? parsed.tags
          .map((tag: unknown) => clean(tag, 60).toLowerCase())
          .filter(Boolean)
          .slice(0, 12)
                : [];

              return {
                slug,
                short_description: clean(parsed.short_description, 155),
                full_description: clean(parsed.full_description, 1800),
                tags,
                details_content: clean(parsed.details_content, 1200),
                material_content: clean(parsed.material_content, 1000),
                care: clean(parsed.care, 800),
                seo_title: clean(parsed.seo_title, 70),
                seo_description: clean(parsed.seo_description, 170),
                image_alt_text: clean(parsed.image_alt_text, 140),
              };
            });
          '''
              path.write_text(text)

          # -------------------------------------------------------------------
          # 2) Product admin form: editable SEO + AI + required validation
          # -------------------------------------------------------------------
          path = Path("src/components/admin/ProductForm.tsx")
          text = path.read_text()

          if "generateProductContent" not in text:
              text = replace_once(
                  text,
                  'import { peekProductCode, reserveProductCode } from "@/lib/admin.functions";',
                  '''import {
            generateProductContent,
            peekProductCode,
            reserveProductCode,
          } from "@/lib/admin.functions";''',
                  "ProductForm admin function import",
              )

              text = replace_once(
                  text,
                  '''  short_description: string;
            full_description: string;
            material: string;''',
                  '''  short_description: string;
            full_description: string;
            seo_title: string;
            seo_description: string;
            image_alt_text: string;
            material: string;''',
                  "ProductForm Draft SEO fields",
              )

              text = replace_once(
                  text,
                  '''    short_description: p?.short_description ?? "",
              full_description: p?.full_description ?? "",
              material: p?.material ?? "",''',
                  '''    short_description: p?.short_description ?? "",
              full_description: p?.full_description ?? "",
              seo_title: (p as any)?.seo_title ?? "",
              seo_description: (p as any)?.seo_description ?? "",
              image_alt_text: (p as any)?.image_alt_text ?? "",
              material: p?.material ?? "",''',
                  "ProductForm toDraft SEO fields",
              )

              text = replace_once(
                  text,
                  '''  const [d, setD] = useState<Draft>(() => toDraft(product));
            const [dirty, setDirty] = useState(false);''',
                  '''  const [d, setD] = useState<Draft>(() => toDraft(product));
            const [dirty, setDirty] = useState(false);
            const [validationErrors, setValidationErrors] = useState<Record<string, string>>({});
            const [aiBusy, setAiBusy] = useState(false);''',
                  "ProductForm validation state",
              )

              text = replace_once(
                  text,
                  '''  const reserveCode = useServerFn(reserveProductCode);
            const previewCode = useServerFn(peekProductCode);''',
                  '''  const reserveCode = useServerFn(reserveProductCode);
            const previewCode = useServerFn(peekProductCode);
            const generateCopy = useServerFn(generateProductContent);''',
                  "ProductForm Gemini hook",
              )

              text = replace_once(
                  text,
                  '''  const set = <K extends keyof Draft>(key: K, value: Draft[K]) => {
              setDirty(true);
              setD((prev) => ({ ...prev, [key]: value }));
            };''',
                  '''  const clearFieldError = (key: string) => {
              setValidationErrors((prev) => {
                if (!prev[key]) return prev;
                const next = { ...prev };
                delete next[key];
                return next;
              });
            };

            const fieldClass = (key: string) =>
              `${adminField} ${
                validationErrors[key]
                  ? "border-red-500/80 focus:border-red-500"
                  : ""
              }`;

            const errorText = (key: string) =>
              validationErrors[key] ? (
                <p className="mt-2 text-[9px] leading-relaxed text-red-400">
                  {validationErrors[key]}
                </p>
              ) : null;

            const set = <K extends keyof Draft>(key: K, value: Draft[K]) => {
              clearFieldError(String(key));
              setDirty(true);
              setD((prev) => ({ ...prev, [key]: value }));
            };''',
                  "ProductForm field validation helpers",
              )

              text = replace_once(
                  text,
                  '''  const relatedCandidates = products.filter((p) => p.id !== product?.id);

            const save = useMutation({''',
                  '''  const relatedCandidates = products.filter((p) => p.id !== product?.id);

            const validate = (publish: boolean) => {
              const errors: Record<string, string> = {};

              if (!d.name.trim()) errors.name = "Product name is required.";
              if (!d.category) errors.category = "Category is required.";

              if (publish) {
                if (!d.price.trim() || Number(d.price) <= 0) {
                  errors.price = "Enter a valid product price.";
                }
                if (!d.short_description.trim()) {
                  errors.short_description = "Short description is required.";
                }
                if (!d.full_description.trim()) {
                  errors.full_description = "Full description is required.";
                }
                if (!d.material.trim()) {
                  errors.material = "Material is required. Use 'Unknown / not confirmed' if necessary.";
                }
                if (!d.finish.trim()) {
                  errors.finish = "Finish / color is required.";
                }
                if (d.quantity_available.trim() === "" || Number(d.quantity_available) < 0) {
                  errors.quantity_available = "Enter a valid stock quantity.";
                }
                if (d.size_type !== "ONE SIZE" && !d.sizes.trim()) {
                  errors.sizes = "Add available sizes for this size type.";
                }
                if (!d.primary_image) {
                  errors.primary_image = "Main product image is required before publishing.";
                }
                if (!d.seo_title.trim()) {
                  errors.seo_title = "SEO title is required.";
                }
                if (!d.seo_description.trim()) {
                  errors.seo_description = "Meta description is required.";
                }
                if (!d.image_alt_text.trim()) {
                  errors.image_alt_text = "Main image ALT text is required.";
                }
              }

              setValidationErrors(errors);
              return Object.keys(errors).length === 0;
            };

            const generateWithAi = async () => {
              const errors: Record<string, string> = {};
              if (!d.name.trim()) errors.name = "Enter the product name before using AI.";
              if (!d.category) errors.category = "Select the category before using AI.";

              if (Object.keys(errors).length) {
                setValidationErrors((prev) => ({ ...prev, ...errors }));
                toast.error("Add product name and category first.");
                return;
              }

              setAiBusy(true);
              try {
                const result = await generateCopy({
                  data: {
          name: d.name,
          category: d.category,
          material: d.material,
          finish: d.finish,
          fit_gender: d.fit_gender,
          sizes: d.sizes,
          size_description: d.size_description,
          existing_description: d.full_description,
                  },
                });

                setDirty(true);
                setD((prev) => ({
                  ...prev,
                  slug: result.slug ? slugify(result.slug) : prev.slug || slugify(prev.name),
                  short_description: result.short_description,
                  full_description: result.full_description,
                  tags: result.tags.join(", "),
                  details_content: result.details_content,
                  material_content: result.material_content,
                  care: result.care,
                  seo_title: result.seo_title,
                  seo_description: result.seo_description,
                  image_alt_text: result.image_alt_text,
                }));
                setValidationErrors({});
                toast.success("AI content generated. Review and edit it before publishing.");
              } catch (err) {
                toast.error(
                  err instanceof Error ? err.message : "Could not generate product content.",
                );
              } finally {
                setAiBusy(false);
              }
            };

            const save = useMutation({''',
                  "ProductForm validation and AI generator",
              )

              text = replace_once(
                  text,
                  '''    mutationFn: async ({ publish }: { publish: boolean }) => {
                if (!d.name.trim()) throw new Error("Product name is required");
                if (!d.category) throw new Error("Pick a category");
                if (publish && !d.primary_image) throw new Error("Add a main image before publishing");

                const qty = Math.max(0, Number(d.quantity_available || 0));''',
                  '''    mutationFn: async ({ publish }: { publish: boolean }) => {
                if (!validate(publish)) {
                  throw new Error(
          publish
            ? "Complete the highlighted required fields before publishing."
            : "Product name and category are required to save a draft.",
                  );
                }

                const qty = Math.max(0, Number(d.quantity_available || 0));''',
                  "ProductForm save validation",
              )

              text = replace_once(
                  text,
                  '''        short_description: d.short_description,
                  full_description: d.full_description,
                  material: d.material,''',
                  '''        short_description: d.short_description,
                  full_description: d.full_description,
                  seo_title: d.seo_title,
                  seo_description: d.seo_description,
                  image_alt_text: d.image_alt_text,
                  material: d.material,''',
                  "ProductForm SEO payload",
              )

              basic_anchor = '''      <section className="glass-panel space-y-6 rounded-[24px] p-6">
                  <h2 className="font-display text-sm tracking-[0.22em] text-foreground">
          BASIC INFORMATION
                  </h2>'''
              basic_new = '''      <section className="glass-panel space-y-5 rounded-[24px] p-6">
                  <div>
          <h2 className="font-display text-sm tracking-[0.22em] text-foreground">
            AI CONTENT + SEO
          </h2>
          <p className="mt-3 max-w-3xl text-[10px] leading-relaxed text-muted-foreground">
            Generate product copy and SEO from the facts you entered. AI never publishes automatically.
            Review every generated field and edit anything you want.
          </p>
                  </div>
                  <AdminButton
          tone="primary"
          disabled={aiBusy}
          onClick={() => void generateWithAi()}
                  >
          {aiBusy ? "Generating…" : "Generate with Gemini AI"}
                  </AdminButton>
                </section>

                {Object.keys(validationErrors).length > 0 && (
                  <section className="rounded-[22px] border border-red-500/45 bg-red-500/[0.06] p-5">
          <p className="text-[9px] uppercase tracking-[0.32em] text-red-300">
            Required information missing
          </p>
          <ul className="mt-3 space-y-1 text-[10px] leading-relaxed text-red-200/90">
            {Object.values(validationErrors).map((message) => (
              <li key={message}>• {message}</li>
            ))}
          </ul>
                  </section>
                )}

                <section className="glass-panel space-y-6 rounded-[24px] p-6">
                  <h2 className="font-display text-sm tracking-[0.22em] text-foreground">
          BASIC INFORMATION
                  </h2>'''
              text = replace_once(text, basic_anchor, basic_new, "ProductForm AI panel")

              replacements = [
                  ('<Field label="Product name">', '<Field label="Product name *">', "name label"),
                  ('className={adminField}\n              value={d.name}', 'className={fieldClass("name")}\n              value={d.name}', "name class"),
                  ('<Field label="Category">', '<Field label="Category *">', "category label"),
                  ('className={adminField}\n              value={d.category}', 'className={fieldClass("category")}\n              value={d.category}', "category class"),
                  ('<Field label="Price">', '<Field label="Price *">', "price label"),
                  ('className={adminField}\n              type="number"\n              min={0}\n              value={d.price}', 'className={fieldClass("price")}\n              type="number"\n              min={0}\n              value={d.price}', "price class"),
                  ('<Field label="Short description">', '<Field label="Short description *">', "short description label"),
                  ('className={adminField}\n            rows={2}\n            value={d.short_description}', 'className={fieldClass("short_description")}\n            rows={2}\n            value={d.short_description}', "short description class"),
                  ('<Field label="Full description">', '<Field label="Full description *">', "full description label"),
                  ('className={adminField}\n            rows={5}\n            value={d.full_description}', 'className={fieldClass("full_description")}\n            rows={5}\n            value={d.full_description}', "full description class"),
                  ('<Field label="Material">', '<Field label="Material *">', "material label"),
                  ('className={adminField}\n              value={d.material}', 'className={fieldClass("material")}\n              value={d.material}', "material class"),
                  ('<Field label="Finish / color (comma separated)">', '<Field label="Finish / color (comma separated) *">', "finish label"),
                  ('className={adminField}\n              value={d.finish}', 'className={fieldClass("finish")}\n              value={d.finish}', "finish class"),
                  ('className={adminField}\n              value={d.sizes}', 'className={fieldClass("sizes")}\n              value={d.sizes}', "sizes class"),
                  ('<Field label="Quantity available">', '<Field label="Quantity available *">', "quantity label"),
                  ('className={adminField}\n              type="number"\n              min={0}\n              value={d.quantity_available}', 'className={fieldClass("quantity_available")}\n              type="number"\n              min={0}\n              value={d.quantity_available}', "quantity class"),
              ]
              for old, new, label in replacements:
                  text = replace_once(text, old, new, f"ProductForm {label}")

              text = replace_once(
                  text,
                  '''              onChange={(e) => {
                const name = e.target.value;
                setDirty(true);''',
                  '''              onChange={(e) => {
                const name = e.target.value;
                clearFieldError("name");
                setDirty(true);''',
                  "ProductForm name error clear",
              )

              images_anchor = '''      <section className="glass-panel space-y-7 rounded-[24px] p-6">
                  <h2 className="font-display text-sm tracking-[0.22em] text-foreground">IMAGES</h2>'''
              seo_section = '''      <section className="glass-panel space-y-6 rounded-[24px] p-6">
                  <div>
          <h2 className="font-display text-sm tracking-[0.22em] text-foreground">
            SEARCH / SEO
          </h2>
          <p className="mt-3 text-[10px] leading-relaxed text-muted-foreground">
            Gemini can fill these fields, but they remain fully editable. These values are used on the public product page.
          </p>
                  </div>

                  <Field label="SEO title *">
          <input
            className={fieldClass("seo_title")}
            value={d.seo_title}
            maxLength={70}
            onChange={(e) => set("seo_title", e.target.value)}
            placeholder="Product search title"
          />
          {errorText("seo_title")}
                  </Field>

                  <Field label="Meta description *">
          <textarea
            className={fieldClass("seo_description")}
            rows={3}
            value={d.seo_description}
            maxLength={170}
            onChange={(e) => set("seo_description", e.target.value)}
            placeholder="Search result description"
          />
          {errorText("seo_description")}
                  </Field>

                  <Field label="Main image ALT text *">
          <input
            className={fieldClass("image_alt_text")}
            value={d.image_alt_text}
            maxLength={140}
            onChange={(e) => set("image_alt_text", e.target.value)}
            placeholder="Accessible description of the main product image"
          />
          {errorText("image_alt_text")}
                  </Field>
                </section>

                <section className="glass-panel space-y-7 rounded-[24px] p-6">
                  <h2 className="font-display text-sm tracking-[0.22em] text-foreground">IMAGES</h2>'''
              text = replace_once(text, images_anchor, seo_section, "ProductForm SEO UI")

              text = replace_once(
                  text,
                  '''        <ImageUploader
          label="Main image"
          max={1}
          value={d.primary_image ? [d.primary_image] : []}
          onChange={(next) => set("primary_image", next[0] ?? "")}
                  />''',
                  '''        <ImageUploader
          label="Main image *"
          max={1}
          value={d.primary_image ? [d.primary_image] : []}
          onChange={(next) => set("primary_image", next[0] ?? "")}
                  />
                  {errorText("primary_image")}''',
                  "ProductForm main image validation",
              )

              path.write_text(text)

          # -------------------------------------------------------------------
          # 3) Keep local Supabase generated type in sync
          # -------------------------------------------------------------------
          path = Path("src/integrations/supabase/types.ts")
          text = path.read_text()

          product_start = text.find("      products: {")
          product_end = text.find("      site_settings: {")
          if product_start < 0 or product_end < 0:
              raise SystemExit("Supabase product type block not found")

          current_block = text[product_start:product_end]
          if "image_alt_text: string" not in current_block:
              before = text[:product_start]
              block = current_block
              after = text[product_end:]

              block = replace_once(
                  block,
                  '''          gallery_images: string[]
          id: string
          material: string''',
                  '''          gallery_images: string[]
          id: string
          image_alt_text: string
          material: string''',
                  "types Product Row image alt",
              )
              block = replace_once(
                  block,
                  '''          related_product_ids: string[]
          short_description: string
          size_description: string''',
                  '''          related_product_ids: string[]
          seo_description: string
          seo_title: string
          short_description: string
          size_description: string''',
                  "types Product Row SEO",
              )

              for label in ("Insert", "Update"):
                  block = replace_once(
                      block,
                      '''          gallery_images?: string[]
          id?: string
          material?: string''',
                      '''          gallery_images?: string[]
          id?: string
          image_alt_text?: string
          material?: string''',
                      f"types Product {label} image alt",
                  )
                  block = replace_once(
                      block,
                      '''          related_product_ids?: string[]
          short_description?: string
          size_description?: string''',
                      '''          related_product_ids?: string[]
          seo_description?: string
          seo_title?: string
          short_description?: string
          size_description?: string''',
                      f"types Product {label} SEO",
                  )

              path.write_text(before + block + after)

          # -------------------------------------------------------------------
          # 4) Public product route uses editable SEO + ALT
          # -------------------------------------------------------------------
          path = Path("src/routes/product.$slug.tsx")
          text = path.read_text()

          if "seoProduct" not in text:
              text = replace_once(
                  text,
                  'import { useSite } from "@/lib/settings";',
                  'import { useSite } from "@/lib/settings";\nimport { supabase } from "@/integrations/supabase/client";',
                  "product route Supabase import",
              )

              old_route = '''export const Route = createFileRoute("/product/$slug")({
            head: ({ params }) => {
              const title = `${pretty(params.slug)} — ZZERKOFF`;
              const description = `${pretty(params.slug)} — a ZZERKOFF object for the afterdark. Unisex chrome accessories.`;
              const canonical = `https://zzerkoff.vercel.app/product/${params.slug}`;
              return {
                meta: [
                  { title },
                  { name: "description", content: description },
                  { property: "og:title", content: title },
                  { property: "og:description", content: description },
                  { property: "og:type", content: "product" },
                  { property: "og:url", content: canonical },
                  {
          property: "og:image",
          content: "https://zzerkoff.vercel.app/images/zzerkoff-logo.png",
