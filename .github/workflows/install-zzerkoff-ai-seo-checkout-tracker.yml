      - name: Check diff
        run: |
          git diff --check
          git status --short

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build test
        run: bun run build

      - name: Commit upgrade
        shell: bash
        run: |
          set -e
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "ZZERKOFF Installer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/lib/admin.functions.ts \
            src/components/admin/ProductForm.tsx \
            src/integrations/supabase/types.ts \
            'src/routes/product.$slug.tsx' \
            src/components/site/OrderModal.tsx \
            src/routes/track-order.tsx \
            src/routes/account.tsx \
            supabase/migrations/20260822205000_product_ai_seo.sql
          git commit -m "Add Gemini product SEO and safer checkout tracking"
          git push origin main
